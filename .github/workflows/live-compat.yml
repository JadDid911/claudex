name: Live compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ vars.CLAUDEX_ENABLE_LIVE_COMPAT == 'true' }}
    runs-on: [self-hosted, claudex-live-compat]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      - name: Pack, install, and time read-only providers
        env:
          CLAUDEX_LIVE_CODEX_MODEL: ${{ vars.CLAUDEX_LIVE_CODEX_MODEL }}
          CLAUDEX_LIVE_CODEX_EFFORT: ${{ vars.CLAUDEX_LIVE_CODEX_EFFORT }}
          CLAUDEX_LIVE_CLAUDE_MODEL: ${{ vars.CLAUDEX_LIVE_CLAUDE_MODEL }}
          CLAUDEX_LIVE_CLAUDE_EFFORT: ${{ vars.CLAUDEX_LIVE_CLAUDE_EFFORT }}
        run: node ./scripts/live-compat.js
