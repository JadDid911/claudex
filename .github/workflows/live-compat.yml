name: Live compatibility

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ vars.CLAUDEX_ENABLE_LIVE_COMPAT == 'true' }}
    runs-on: [self-hosted, claudex-live-compat]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run verify
      - name: Pack tarball
        id: pack
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';

          const npmCommand = process.platform === 'win32' ? 'npm.cmd' : 'npm';
          const result = spawnSync(npmCommand, ['pack', '--json', '--ignore-scripts'], {
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
            shell: process.platform === 'win32',
          });

          if (result.error) throw result.error;
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status ?? 1);
          }

          const packResult = JSON.parse(result.stdout).at(-1);
          if (!packResult?.filename) {
            throw new Error('npm pack did not return a tarball filename.');
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `path=${resolve(packResult.filename)}\n`);
          NODE
      - name: Install tarball outside the repository
        id: install
        env:
          PACKAGE_PATH: ${{ steps.pack.outputs.path }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const npmCommand = process.platform === 'win32' ? 'npm.cmd' : 'npm';
          const installRoot = mkdtempSync(path.join(tmpdir(), 'claudex-live-install-'));
          let result = spawnSync(npmCommand, ['init', '-y'], {
            cwd: installRoot,
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
            shell: process.platform === 'win32',
          });

          if (result.error) throw result.error;
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status ?? 1);
          }

          result = spawnSync(npmCommand, ['install', '--no-package-lock', process.env.PACKAGE_PATH], {
            cwd: installRoot,
            encoding: 'utf8',
            stdio: ['ignore', 'pipe', 'pipe'],
            shell: process.platform === 'win32',
          });

          if (result.error) throw result.error;
          if (result.status !== 0) {
            process.stderr.write(result.stderr || result.stdout);
            process.exit(result.status ?? 1);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `root=${installRoot}\n`);
          NODE
      - name: Run read-only provider smoke
        env:
          INSTALL_ROOT: ${{ steps.install.outputs.root }}
          CLAUDEX_LIVE_CODEX_MODEL: ${{ vars.CLAUDEX_LIVE_CODEX_MODEL }}
          CLAUDEX_LIVE_CODEX_EFFORT: ${{ vars.CLAUDEX_LIVE_CODEX_EFFORT }}
          CLAUDEX_LIVE_CLAUDE_MODEL: ${{ vars.CLAUDEX_LIVE_CLAUDE_MODEL }}
          CLAUDEX_LIVE_CLAUDE_EFFORT: ${{ vars.CLAUDEX_LIVE_CLAUDE_EFFORT }}
        shell: bash
        run: |
          cd "$INSTALL_ROOT"
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { createClaudeProvider, createCodexProvider } from '@jaddid911/claudex/providers';

          const workspace = mkdtempSync(path.join(tmpdir(), 'claudex-live-workspace-'));
          const providers = [
            ['codex', createCodexProvider({
              model: process.env.CLAUDEX_LIVE_CODEX_MODEL || null,
              effort: process.env.CLAUDEX_LIVE_CODEX_EFFORT || null,
            })],
            ['claude', createClaudeProvider({
              model: process.env.CLAUDEX_LIVE_CLAUDE_MODEL || null,
              effort: process.env.CLAUDEX_LIVE_CLAUDE_EFFORT || null,
            })],
          ];
          const rows = [];

          for (const [name, provider] of providers) {
            const detectStarted = Date.now();
            const status = await provider.detect();
            const detectMs = Date.now() - detectStarted;
            if (!status.available || !status.canRead) {
              throw new Error(`${name} is unavailable for read-only smoke: ${status.reason ?? 'unknown reason'}`);
            }

            let firstTextAt = null;
            const turnStarted = Date.now();
            const result = await provider.runTurn({
              prompt: 'Reply with exactly OK. Do not inspect files or use tools.',
              workspace,
              access: 'read',
              onEvent(event) {
                if (
                  firstTextAt === null &&
                  (event?.type === 'text.delta' || event?.type === 'text.message') &&
                  String(event?.text ?? '').length > 0
                ) {
                  firstTextAt = Date.now();
                }
              },
            });
            const totalMs = Date.now() - turnStarted;

            if (result.status !== 'completed') {
              throw new Error(`${name} read-only smoke did not complete: ${result.status}`);
            }

            if (!/\bOK\b/u.test(String(result.text ?? ''))) {
              throw new Error(`${name} read-only smoke returned unexpected text: ${String(result.text ?? '').slice(0, 120)}`);
            }

            rows.push({
              provider: name,
              version: status.providerVersion ?? 'unknown',
              auth: status.authStatus ?? 'unknown',
              model: provider.model ?? 'provider default',
              effort: provider.effort ?? 'provider default',
              detectMs,
              firstTextMs: firstTextAt === null ? null : firstTextAt - turnStarted,
              totalMs,
            });

            if (totalMs > 30_000) {
              console.log(`::warning title=${name} live latency::Read-only smoke took ${totalMs} ms.`);
            }
          }

          const summary = [
            '## Claudex live provider latency',
            '',
            '| Provider | CLI | Auth | Model | Effort | Detect | First text | Total |',
            '| --- | --- | --- | --- | --- | ---: | ---: | ---: |',
            ...rows.map((row) =>
              `| ${row.provider} | ${row.version} | ${row.auth} | ${row.model} | ${row.effort} | ${row.detectMs} ms | ${row.firstTextMs ?? 'n/a'} ms | ${row.totalMs} ms |`
            ),
            '',
            'This probe calls each provider directly through the packaged adapter. High latency here points upstream; normal latency here with a slow interactive room points to orchestration, workspace tools, or terminal rendering.',
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          console.log(JSON.stringify(rows));
          NODE
